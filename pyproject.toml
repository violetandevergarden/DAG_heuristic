[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-heuristic"
version = "0.1.0"
description = "Communication scheduling for LLM training DAGs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
integration = ["jsonschema>=4"]

[project.scripts]
dag-schedule = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "registry"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark*", "core*", "single_channel*", "muti_channel*", "llm_structured*"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", ".."]
testpaths = ["tests"]
markers = ["simai: requires the optional SimAI integration checkout"]

[tool.ruff]
target-version = "py311"
line-length = 100
